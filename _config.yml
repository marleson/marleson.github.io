# =============================================================================
#  Configuração do site — Márleson Ferreira
# =============================================================================
# Este arquivo NÃO é recarregado automaticamente pelo `jekyll serve`.
# Depois de alterá-lo, pare o servidor (Ctrl+C) e rode novamente.
#
# Documentação do tema: https://mmistakes.github.io/minimal-mistakes/docs/configuration/

# Tema
# O tema é carregado diretamente do GitHub, numa versão fixa. Para atualizar,
# basta trocar o número depois do "@" (veja https://github.com/mmistakes/minimal-mistakes/releases).
remote_theme             : "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin    : "contrast" # "default", "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise", "catppuccin_latte", "catppuccin_mocha"

# Site
locale                   : "pt-BR"
title                    : "Márleson Ferreira"
title_separator          : "-"
subtitle                 : "Códigos, notas de aula e mais"
name                     : "Márleson Ferreira"
description              : "Site pessoal de Márleson Ferreira: notas de aula de matemática, códigos, tutoriais e mais."
url                      : "https://marleson.github.io"
baseurl                  : ""
repository               : "marleson/marleson.github.io"
teaser                   : "/images/bg.jpg"
logo                     : "/images/favicon-96x96.png"
masthead_title           :
breadcrumbs              : true
words_per_minute         : 200
enable_copy_code_button  : true
date_format              : "%d/%m/%Y"

# Comentários
# Recomendado: giscus (gratuito, usa as Discussions do GitHub, sem anúncios).
# Para ativar:
#   1. Ative "Discussions" em Settings > General do repositório no GitHub
#   2. Instale o app https://github.com/apps/giscus no repositório
#   3. Gere os IDs em https://giscus.app/pt e preencha abaixo
#   4. Troque `provider` para "giscus"
comments:
  provider               : false # false, "giscus", "utterances", "disqus", "discourse", "facebook", "staticman_v2", "custom"
  giscus:
    repo_id              : # ex.: "R_kgDO..."
    category_name        : "Comentários"
    category_id          : # ex.: "DIC_kwDO..."
    discussion_term      : "pathname"
    reactions_enabled    : "1"
    theme                : "light"
    strict               : "0"
    input_position       : "bottom"
    emit_metadata        : "0"
    lazy                 : true

atom_feed:
  path                   : # em branco usa /feed.xml
  hide                   : false

search                   : true
search_full_content      : true
search_provider          : lunr

# SEO
google_site_verification :
bing_site_verification   :

# Redes sociais
twitter:
  username               : "marleson"
facebook:
  username               : "marleson.ferreira"
  app_id                 :
  publisher              :
og_image                 : "/images/site-logo.png"
social:
  type                   : Person
  name                   : "Márleson Ferreira"
  links:
    - "https://x.com/marleson"
    - "https://www.facebook.com/marleson.ferreira"
    - "https://instagram.com/marlesonferreira"
    - "https://github.com/marleson"

# Analytics
# O Google Analytics "Universal" (IDs UA-...) foi desativado pelo Google em 2023.
# Para voltar a medir acessos, crie uma propriedade GA4 em https://analytics.google.com,
# copie o ID "G-XXXXXXXXXX" e preencha abaixo trocando `provider` para "google-gtag".
analytics:
  provider               : false # false, "google-gtag", "custom"
  google:
    tracking_id          : # "G-XXXXXXXXXX"
    anonymize_ip         : true

# Autor (barra lateral)
author:
  name             : "Márleson Ferreira"
  avatar           : "/images/marleson-icon.jpg"
  bio              : "Professor &#124; Matemático &#124; Pesquisador"
  location         : "Santana, AP - Brasil"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-square-envelope"
      url: "mailto:marleson.ferreira@ifap.edu.br"
    - label: "X (Twitter)"
      icon: "fab fa-fw fa-square-x-twitter"
      url: "https://x.com/marleson"
    - label: "Facebook"
      icon: "fab fa-fw fa-square-facebook"
      url: "https://facebook.com/marleson.ferreira"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/marleson"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/marlesonferreira"

# Rodapé
footer:
  since: "2020"
  links:
    - label: "X (Twitter)"
      icon: "fab fa-fw fa-square-x-twitter"
      url: "https://x.com/marleson"
    - label: "Facebook"
      icon: "fab fa-fw fa-square-facebook"
      url: "https://facebook.com/marleson.ferreira"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/marleson"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/marlesonferreira"

# Leitura de arquivos
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - .github
  - _modelos
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - requirements.txt
  - bin
  - tmp
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversão
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  math_engine: mathjax

sass:
  sass_dir: _sass
  style: compressed

# Saída
permalink: /:categories/:title/
timezone: America/Belem
paginate: 5
paginate_path: /page:num/

# Plugins (todos suportados pelo GitHub Pages)
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-titles-from-headings

whitelist:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-titles-from-headings

titles_from_headings:
  enabled:     true
  strip_title: true
  collections: true

# Arquivos por categoria/tag
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Compressão de HTML
compress_html:
  clippings: all
  ignore:
    envs: development

# Coleções
collections:
  tutoriais:
    output: true
    permalink: /:collection/:path/
  notas-de-aula:
    output: true
    permalink: /:collection/:path/
  codigos:
    output: true
    permalink: /:collection/:path/

# Valores padrão (front matter) de cada tipo de conteúdo
defaults:
  # Posts do blog
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      comments: true
      share: true
      related: true
      mathjax: true

  # Páginas avulsas (_pages)
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

  # Tutoriais
  - scope:
      path: ""
      type: tutoriais
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      share: true
      comments: true
      mathjax: true

  # Notas de aula: matemática ligada, sumário lateral fixo
  - scope:
      path: ""
      type: notas-de-aula
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      share: true
      comments: true
      mathjax: true
      toc: true
      toc_sticky: true
      toc_label: "Sumário"
      toc_icon: "list"

  # Códigos
  - scope:
      path: ""
      type: codigos
    values:
      layout: single
      author_profile: true
      show_date: true
      share: true
      comments: true
