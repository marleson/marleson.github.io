<!-- start custom head snippets -->

<!-- Ícones / PWA -->
<link rel="icon" type="image/png" sizes="96x96" href="{{ '/images/favicon-96x96.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/marleson-icon.jpg' | relative_url }}">
<meta name="theme-color" content="#000000">

{% if page.mathjax %}
<!-- MathJax 4: LaTeX nas páginas com `mathjax: true` no front matter -->
<script>
  // O tema zera a margem de cima de todo ":first-child" dentro de .page__content.
  // Isso também atinge as peças com que o MathJax monta parênteses e colchetes altos
  // (matrizes com 3 ou mais linhas), e o pedaço de cima do delimitador some.
  // Aqui a regra do tema passa a ignorar o que está dentro das fórmulas.
  (function () {
    var alvo = '.page__content :first-child';
    for (var f = 0; f < document.styleSheets.length; f++) {
      var folha = document.styleSheets[f], regras;
      try { regras = folha.cssRules; } catch (e) { continue; }
      for (var i = 0; i < regras.length; i++) {
        var r = regras[i];
        if (r.selectorText && r.selectorText.indexOf(alvo) === 0) {
          var sel = r.selectorText.replace(alvo, alvo + ':not(mjx-container *)');
          try { folha.insertRule(sel + '{' + r.style.cssText + '}', i); folha.deleteRule(i + 1); } catch (e) {}
          return;
        }
      }
    }
  })();

  window.MathJax = {
    tex: {
      {%- if page.collection == 'notas-de-aula' %}
      // Nas notas de aula só \( ... \) é fórmula em linha: assim "R$ 4,00" fica como texto
      inlineMath: [['\\(', '\\)']],
      {%- else %}
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      {%- endif %}
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      tags: 'ams',
      macros: {
        R: '\\mathbb{R}',
        N: '\\mathbb{N}',
        Z: '\\mathbb{Z}',
        Q: '\\mathbb{Q}',
        C: '\\mathbb{C}',
        dd: '\\,\\mathrm{d}',
        abs: ['\\left|#1\\right|', 1],
        norm: ['\\left\\|#1\\right\\|', 1]
      }
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    },
    output: {
      displayOverflow: 'linebreak',
      linebreaks: { inline: true }
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
{% endif %}

{% if page.graficos %}
<!-- Gráficos interativos (páginas com `graficos: true`) -->
<script defer src="{{ '/assets/js/grafico-afim.js' | relative_url }}"></script>
{% endif %}

{% for js in page.interativos %}
<!-- Interativos da aula (front matter `interativos: [nome]` carrega assets/js/nome.js) -->
<script defer src="{{ '/assets/js/' | append: js | append: '.js' | relative_url }}"></script>
{% endfor %}

<!-- Botões de reação/compartilhamento (ShareThis) -->
<script src="https://platform-api.sharethis.com/js/sharethis.js#property=5ebb0ff07525e90012616e2b&product=inline-reaction-buttons" async="async"></script>

<!-- end custom head snippets -->
